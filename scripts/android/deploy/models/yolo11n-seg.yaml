# Ultralytics YOLO11n-seg instance segmentation, 640x640: conv net + head + mask prototypes on the HTP;
# per-class NMS and the mask assembly (coefficients x prototypes,
# cropped to the box) on the CPU, in the demo app (../maskrcnn_demo_app/native/yolo_engine.cpp).
# AGPL-3.0 weights, as the detection models'.
name: yolo11n-seg
fetch:
  # official weights (github.com/ultralytics/assets v8.4.0, sha256-pinned), exported by the pinned
  # recipe: output0 (1, 4 + 80 + 32, 8400) = cx,cy,w,h + sigmoid scores + mask coefficients,
  # output1 (1, 32, 160, 160) = mask prototypes
  script: export_yolo26.py
  args: [yolo11n-seg.pt, 55ed65c56c91713d23e8402371c6c49a6fd84f257f7dce452e8d70e41dcbe152, head]
inputs:
  images: {shape: [1, 3, 640, 640]}
preprocess: {kind: letterbox, size: [640, 640], pad: 114}
calibration:
  # 64 COCO val2017 images (a fixed, arbitrary slice of the val ids), downloaded once
  coco_val2017: [139, 285, 632, 724, 776, 785, 802, 872, 885, 1000, 1268, 1296, 1353, 1425, 1490,
                 1503, 1532, 1584, 1675, 1761, 1818, 1993, 2006, 2149, 2153, 2157, 2261, 2299, 2431,
                 2473, 2532, 2587, 2592, 2685, 2923, 3156, 3255, 3501, 3553, 3845, 3934, 4134, 4395,
                 4495, 4765, 4795, 5001, 5037, 5060, 5193, 5477, 5503, 5529, 5586, 5600, 5992, 6012,
                 6040, 6213, 6460, 6471, 6614, 6723, 6763]
eval:
  coco_val2017: [7088, 7108, 7278, 7281, 7386, 7511, 7574, 7784, 7795, 7816, 7818, 7888, 7977, 7991,
                 8021, 8211, 8277, 8532, 8629, 8690]
quantize:
  enabled: true
  # as yolo11n.yaml (mse)
  calibration_method: mse
  per_channel: true
  activation: uint8
  exclude_nodes: [/model.23/Concat_4]
rewrites:
  - {name: uint8_input, layout: nhwc}
pipeline:
  qnn: {htp_performance_mode: burst}
  host_quantize: true
bench: {warmup: 3, reps: 20, cpu_threads: 4}
accuracy: {kind: tensor}
