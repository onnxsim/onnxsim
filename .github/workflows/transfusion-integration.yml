# Weekly run of the TransFusion integration test (tests/test_transfusion_integration.py)
# on Autoware's lidar TransFusion model: builds onnxsim from source, fetches the model at
# a pinned Hugging Face revision (checksum-verified), and runs the test against it. The
# schedule keeps the check running after the PR that added it merges; workflow_dispatch
# runs it on demand.
name: TransFusion integration

on:
  schedule:
    - cron: '56 8 * * 1'  # Mondays 08:56 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  TRANSFUSION_REVISION: v2.1
  TRANSFUSION_SHA256: 1d8f0ee6d59ccc3cca914f9892f6ac8f0a9e35082abb91da183c00e3e2c2718a

jobs:
  transfusion_integration:
    name: TransFusion ONNX integration
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build and install onnxsim
        run: python -m pip install -v .
      - name: Install test deps
        run: python -m pip install pytest onnxruntime
      - name: Fetch TransFusion model
        run: |
          curl -sSfL -o "$RUNNER_TEMP/transfusion.onnx" \
            "https://huggingface.co/AutowareFoundation/lidar_transfusion/resolve/${TRANSFUSION_REVISION}/transfusion.onnx"
          echo "${TRANSFUSION_SHA256}  $RUNNER_TEMP/transfusion.onnx" | sha256sum --check
          echo "TRANSFUSION_ONNX=$RUNNER_TEMP/transfusion.onnx" >> "$GITHUB_ENV"
      # Run from a neutral directory so the repo's own ./onnxsim/ source package
      # cannot shadow the installed wheel (same approach as build-and-test.yml's
      # formal verification job).
      - name: Run integration test
        working-directory: ${{ runner.temp }}
        run: python -m pytest "$GITHUB_WORKSPACE/tests/test_transfusion_integration.py" -v
