name: nerfstudio ONNX Export Integration

# End-to-end tests that export a real nerfstudio `NerfactoField` to ONNX and run
# it through onnxsim.simplify and onnxruntime (tests/test_nerfstudio_onnx_export.py).
#
# nerfstudio is a large dependency and is not importable on Python 3.11+ without a
# one-line shim (its own configs/base_config.py trips the widened dataclass
# mutable-default check -- upstream nerfstudio-project/nerfstudio#3106, which the
# test applies and documents). It is therefore not part of onnxsim's test
# requirements, and this runs in its own workflow instead of the build-and-test
# matrix -- the same arrangement as the Core ML, MLIR and ModelOpt integrations.
#
# What this buys that the rest of the suite does not: the NeRF op coverage added
# for onnxsim's exporters (Einsum decomposition, Sin/Cos, GridSample) is unit
# tested against hand-built graphs, but a real nerfstudio graph is what those
# rewrites actually have to survive. This job pins the measurements recorded in
# docs/nerfstudio-onnx-export.md -- notably that the Instant-NGP hash grid's
# `torch.bitwise_xor` needs the dynamo exporter (it lowers to ONNX BitwiseXor,
# opset 18+) and that onnxsim must leave that hash graph untouched.
#
# CPU only: nerfstudio's `implementation="tcnn"` path is a CUDA-only fused
# kernel, and `gsplat` (splatfacto) likewise has no CPU or ONNX representation,
# so the CPU `implementation="torch"` path is what is covered here.

on:
  schedule:
    - cron: "0 8 * * 1" # Weekly, Monday 08:00 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - "onnxsim/einsum_decompose.py"
      - "onnxsim/gridsample_plan.py"
      - "onnxsim/coreml_export.py"
      - "onnxsim/tflite_export.py"
      - "onnxsim/onnx_simplifier.py"
      - "onnxsim/__init__.py"
      - "tests/test_nerfstudio_onnx_export.py"
      - "tests/test_exporter_nerf_ops.py"
      - "docs/nerfstudio-onnx-export.md"
      - ".github/workflows/nerfstudio-onnx-export.yml"

concurrency:
  group: nerfstudio-onnx-export-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Build onnxsim once from the current tree, exactly like the Core ML / MLIR /
  # ModelOpt integration workflows, and hand the wheel to the test job so it
  # exercises this branch's code rather than a PyPI release.
  build:
    name: Build onnxsim wheel
    runs-on: ubuntu-24.04
    env:
      SCCACHE_GHA_ENABLED: "on"
      ACTIONS_CACHE_SERVICE_V2: "on"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: Build cp311 wheel
        uses: pypa/cibuildwheel@v4.2.1
        env:
          CIBW_BUILD: "cp311-manylinux_x86_64"
          CIBW_ARCHS: native
          CIBW_BUILD_FRONTEND: "pip; args: --no-build-isolation"
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_ENVIRONMENT_PASS_LINUX: CI SCCACHE_GHA_ENABLED ACTIONS_RESULTS_URL ACTIONS_RUNTIME_TOKEN ACTIONS_CACHE_SERVICE_V2
          CIBW_BEFORE_BUILD: "python3 -m pip install --break-system-packages cmake ninja setuptools sccache nanobind"
          CIBW_ENVIRONMENT: "CMAKE_ARGS=\"-DONNX_USE_PROTOBUF_SHARED_LIBS=OFF\" CMAKE_GENERATOR=Ninja CMAKE_CXX_COMPILER_LAUNCHER=sccache CMAKE_LINKER_TYPE=LLD"
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: "auditwheel repair -w {dest_dir} {wheel} --strip"
      - uses: actions/upload-artifact@v7
        with:
          name: onnxsim-wheel-linux
          path: ./wheelhouse/*.whl

  test:
    name: Export nerfstudio nerfacto and run under ORT
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # Jobs do not share a filesystem, so the wheel built above has to be
      # fetched explicitly before it can be installed.
      - uses: actions/download-artifact@v8
        with:
          name: onnxsim-wheel-linux
          path: wheelhouse

      - name: Install the built onnxsim wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install wheelhouse/*.whl

      # nerfstudio pulls in ~90 packages (open3d, viser, jupyterlab, opencv,
      # tensorboard, gsplat ...), which is why this is its own workflow rather
      # than an extra in the build-and-test matrix. `onnxscript` is not optional
      # here: it is what backs `torch.onnx.export(dynamo=True)`, and the dynamo
      # exporter is the only one that can emit the hash grid's bitwise_xor.
      - name: Install nerfstudio
        run: |
          python -m pip install nerfstudio onnxscript

      # pytest is not a nerfstudio dependency, so install it explicitly rather
      # than relying on a transitive one.
      - name: Install test runner
        run: python -m pip install pytest

      # The checkout puts the repo root on sys.path, whose ./onnxsim has no
      # compiled extension and would shadow the installed wheel -- run from a
      # neutral directory so the wheel is what gets imported.
      - name: Verify the installed wheel is used (not the source tree)
        working-directory: ${{ runner.temp }}
        run: python -c "import onnxsim, onnxsim.onnxsim_cpp2py_export as m; print(onnxsim.__version__, m.__file__)"

      - name: Run the nerfstudio export tests
        working-directory: ${{ runner.temp }}
        run: python -m pytest "$GITHUB_WORKSPACE/tests/test_nerfstudio_onnx_export.py" -v