name: convertmodel inference test

on:
  push:
    branches: ["master"]
    paths:
      - "scripts/convertmodel/**"
      - ".github/workflows/convertmodel-inference.yml"
  pull_request:
    paths:
      - "scripts/convertmodel/**"
      - ".github/workflows/convertmodel-inference.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install onnxruntime-web
        working-directory: scripts/convertmodel
        run: npm ci
      - name: Run Netron URL builder test
        working-directory: scripts/convertmodel
        run: npm run test:netron
      - name: Run trace-assembler unit test
        working-directory: scripts/convertmodel
        run: npm run test:trace
      - name: Run MAC-metrics reader unit test
        working-directory: scripts/convertmodel
        run: npm run test:macs
      - name: Run dim_param shape-reader unit test
        working-directory: scripts/convertmodel
        run: npm run test:shapes
      - name: Run Hugging Face loader unit test
        working-directory: scripts/convertmodel
        run: npm run test:hf
      - name: Run Xet chunk-cache unit test
        working-directory: scripts/convertmodel
        run: npm run test:xet
      - name: Run WebNN helper unit test
        working-directory: scripts/convertmodel
        run: npm run test:webnn
      - name: Run browser-calibration unit test
        working-directory: scripts/convertmodel
        run: npm run test:quantize-cal
      - name: Run library-versions unit test
        working-directory: scripts/convertmodel
        run: npm run test:versions
      - name: Run backend-test-runner unit test
        working-directory: scripts/convertmodel
        run: npm run test:backend
      - name: Run query-parameter unit test
        working-directory: scripts/convertmodel
        run: npm run test:query
      - name: Run CDN source-of-truth unit test
        working-directory: scripts/convertmodel
        run: npm run test:cdn
      - name: Run input-fill helper unit test
        working-directory: scripts/convertmodel
        run: npm run test:fill
      - name: Run inference smoke test (wasm EP)
        working-directory: scripts/convertmodel
        run: npm run test:inference
      - name: Run before/after comparison test (wasm EP)
        working-directory: scripts/convertmodel
        run: npm run test:compare
      # Runs the committed QAT step-graph fixtures through onnxruntime-web and
      # prints which execution providers actually executed the operators
      # onnxsim/qat_graph.py's EP_FRIENDLY_OPS claims coverage for. wasm is the
      # only EP a headless runner can reach, and the only one this asserts;
      # WebGPU and WebNN are attempted and reported as unreached. Set
      # ORT_REQUIRE=wasm,webgpu on a runner that has a GPU to make WebGPU a
      # hard requirement there instead.
      - name: Run step-graph EP coverage test (wasm EP; webgpu/webnn reported)
        working-directory: scripts/convertmodel
        run: npm run test:stepgraph
