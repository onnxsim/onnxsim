name: onnx-finetune training (incl. distillation)

# Covers what onnx-finetune-lora.yml deliberately doesn't: generate_artifacts.py
# itself (every --loss mode, not just distillation) plus a real training step
# via onnxruntime.training.api -- both need a *training-enabled* onnxruntime,
# not the plain onnxruntime that workflow installs.
#
# `pip install onnxruntime-training` (a separate, official PyPI distribution)
# is enough for both -- no from-source onnxruntime build needed here. That's
# deliberate: this job covers the Python side only. The native onnx-finetune
# CLI and its WASM binding (tools/onnx-finetune/src/, wasm/src/) need actual
# C++ headers and a linkable library with the training API exported, which no
# pip package provides (verified: the onnxruntime-training wheel statically
# links the training API into its Python-only pybind extension, with no
# onnxruntime_training_cxx_api.h and no exported C API symbols) -- building
# and testing those needs a genuine from-source onnxruntime build
# (--enable_training_apis, ~20-40 min; ~25-40 min again for the WASM+JSEP
# variant, see wasm/README.md), which used to run here but was removed as
# not worth the CI cost: both tools/onnx-finetune/README.md and wasm/README.md
# document that build recipe and how to run each tool by hand, but neither is
# exercised by automation -- a regression in either would only surface on a
# manual run, not in CI.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tools/onnx-finetune/**"
      - ".github/workflows/onnx-finetune-training.yml"
  push:
    branches: [master]
    paths:
      - "tools/onnx-finetune/**"
      - ".github/workflows/onnx-finetune-training.yml"

concurrency:
  group: onnx-finetune-training-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  distillation-python:
    name: Python (generate_artifacts.py + a real training step)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install deps (onnxruntime-training needs no source build -- see README.md)
        run: pip install onnx numpy onnxruntime-training pytest
      - name: pytest tools/onnx-finetune/tests/test_distillation.py
        run: pytest tools/onnx-finetune/tests/test_distillation.py -v
