name: onnx-finetune training (incl. distillation)

# Covers what onnx-finetune-lora.yml deliberately doesn't: generate_artifacts.py
# itself (every --loss mode) plus a real training step via
# onnxruntime.training.api -- both need a *training-enabled* onnxruntime, not
# the plain onnxruntime that workflow installs. Neither job below is that,
# though: generate_artifacts.py itself isn't exercised by automation here
# (README.md documents the from-source-build recipe for running it and
# src/main.cpp/wasm/src/onnx_finetune_wasm.cpp by hand).
#
# distillation-graph-grad-native / -wasm: onnx-finetune's only distillation
# implementation (scripts/generate_distillation_step_graph.py +
# src/distill_step_graph_main.cpp + wasm/distill_step_graph/), differentiating
# the KD loss with onnxsim's own graph_grad/qat_graph autodiff instead of
# onnxruntime.training -- see ../README.md's "Knowledge distillation" section
# for the full design writeup. Its whole point is that the resulting step
# graph runs on a *plain* onnxruntime/onnxruntime-web, so both jobs stay
# cheap: a plain prebuilt onnxruntime release download (native) or the
# official onnxruntime-web npm package (wasm), no --enable_training_apis
# source build (~20-40 min; ~25-40 min again for the WASM+JSEP variant) like
# the one that used to run here (for the old onnxruntime.training-based
# --loss distillation path this repo no longer has) and was removed as not
# worth the CI cost -- see wasm/README.md's Status section. Both still build
# this repo's own onnxsim wheel (ONNXSIM_BUILTIN_ORT=OFF, see the top-level
# CLAUDE.md note that this does NOT build ONNX Runtime), since
# generate_distillation_step_graph.py needs onnxsim.graph_grad/qat_graph
# importable.
#
# The TrainingSession-based native CLI (src/main.cpp) and WASM binding
# (wasm/src/onnx_finetune_wasm.cpp) -- every non-distillation --loss mode --
# still need that from-source build to compile at all; both README.md and
# wasm/README.md document the recipe and how to run each tool by hand, but
# neither is exercised by automation.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tools/onnx-finetune/**"
      - "onnxsim/graph_grad.py"
      - "onnxsim/graph_grad.cpp"
      - "onnxsim/graph_grad.h"
      - "onnxsim/qat_graph.py"
      - ".github/workflows/onnx-finetune-training.yml"
  push:
    branches: [master]
    paths:
      - "tools/onnx-finetune/**"
      - "onnxsim/graph_grad.py"
      - "onnxsim/graph_grad.cpp"
      - "onnxsim/graph_grad.h"
      - "onnxsim/qat_graph.py"
      - ".github/workflows/onnx-finetune-training.yml"

concurrency:
  group: onnx-finetune-training-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pinned so the three jobs below (native, wasm, and a human following
  # README.md by hand) agree on which release to fetch.
  PLAIN_ORT_VERSION: "1.19.2"

jobs:
  distillation-graph-grad-native:
    name: graph_grad distillation (native, plain onnxruntime -- no --enable_training_apis)
    runs-on: ubuntu-24.04
    # Caches the onnxsim wheel build's C++ compilation (onnx/onnx-optimizer/
    # onnxsim's own sources) across runs, the same way build-and-test.yml's
    # own onnxsim-building jobs already do -- without it this step alone is
    # ~25-30 minutes of cold compilation every single run.
    env:
      CMAKE_GENERATOR: Ninja
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
      SCCACHE_GHA_ENABLED: "on"
      ACTIONS_CACHE_SERVICE_V2: "on"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: Install build + test deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build
          pip install nanobind onnx numpy onnxruntime pytest
      - name: Build and install onnxsim (ONNXSIM_BUILTIN_ORT=OFF -- see CLAUDE.md)
        run: pip install -e . --no-build-isolation
      - name: pytest the Log VJP rule, its Python<->C++ parity, and the step-graph generator
        run: |
          pytest tests/test_graph_grad.py tests/test_graph_grad_registry.py \
            tests/test_graph_grad_templates.py tests/test_qat_parity.py \
            tools/onnx-finetune/tests/test_distillation_graph_grad.py -v
      - name: Download a plain prebuilt onnxruntime release (no build at all)
        run: |
          curl -sSL -o /tmp/ort.tgz "https://github.com/microsoft/onnxruntime/releases/download/v${PLAIN_ORT_VERSION}/onnxruntime-linux-x64-${PLAIN_ORT_VERSION}.tgz"
          tar xzf /tmp/ort.tgz -C /tmp
      - name: Configure and build onnx-finetune-distill-step-graph
        run: |
          cmake -B tools/onnx-finetune/build tools/onnx-finetune \
            -DORT_HOME=/tmp/onnxruntime-linux-x64-${PLAIN_ORT_VERSION}
          cmake --build tools/onnx-finetune/build --target onnx-finetune-distill-step-graph
      - name: "End to end: generate a step graph, train with the compiled CLI, reassemble the final model"
        run: |
          python3 tools/onnx-finetune/scripts/make_toy_classifier.py -o /tmp/teacher.onnx \
            --input-dim 8 --hidden-dim 32 --num-classes 4 --seed 1
          python3 tools/onnx-finetune/scripts/make_toy_classifier.py -o /tmp/student.onnx \
            --input-dim 8 --hidden-dim 8 --num-classes 4 --seed 2
          python3 tools/onnx-finetune/scripts/generate_distillation_step_graph.py \
            /tmp/student.onnx -o /tmp/step.onnx
          python3 -c "
          import numpy as np
          rng = np.random.default_rng(0)
          x = rng.standard_normal((250, 8)).astype(np.float32)
          labels = rng.integers(0, 4, size=250).astype(np.int64)
          x.tofile('/tmp/train_input.bin')
          labels.tofile('/tmp/train_labels.bin')
          "
          # 250 samples, --batch-size 32 -- deliberately not an even split, to
          # exercise the step graph's dynamic batch dimension on the last,
          # smaller step of every epoch too.
          tools/onnx-finetune/build/onnx-finetune-distill-step-graph \
            --step-graph /tmp/step.onnx --teacher-model /tmp/teacher.onnx \
            --train-input /tmp/train_input.bin --train-target /tmp/train_labels.bin \
            --num-samples 250 --batch-size 32 --epochs 5 --lr 0.05 --log-every 4 \
            --output-weights /tmp/final_weights.bin
          python3 tools/onnx-finetune/scripts/apply_trained_weights.py \
            /tmp/student.onnx /tmp/step.onnx.manifest.txt /tmp/final_weights.bin \
            -o /tmp/student_trained.onnx

  distillation-graph-grad-wasm:
    name: graph_grad distillation (wasm, via official onnxruntime-web -- no custom build)
    runs-on: ubuntu-24.04
    env:
      CMAKE_GENERATOR: Ninja
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
      SCCACHE_GHA_ENABLED: "on"
      ACTIONS_CACHE_SERVICE_V2: "on"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
          pip install nanobind onnx numpy
      - name: Build and install onnxsim (ONNXSIM_BUILTIN_ORT=OFF -- see CLAUDE.md)
        run: pip install -e . --no-build-isolation
      - name: npm install (onnxruntime-web)
        working-directory: tools/onnx-finetune/wasm/distill_step_graph
        run: npm install
      - name: "node --test (trains a step graph via the official onnxruntime-web package)"
        working-directory: tools/onnx-finetune/wasm/distill_step_graph
        run: npm test
