name: Coverage (C++, Python, JS and Rust)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # C++ + Python + JS coverage from a single pytest run plus the Node suite.
  # Emits Cobertura reports and hands them to the `report` job below rather than
  # posting its own comment, so all languages fold into one summary.
  cpp-python-js:
    name: C++/Python/JS coverage
    runs-on: ubuntu-latest
    env:
      CMAKE_GENERATOR: Ninja
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
      CMAKE_LINKER_TYPE: MOLD
      # COVERAGE=1 makes setup.py configure -DONNXSIM_COVERAGE=ON (instrument
      # onnxsim's own C++ with --coverage) and force a Debug/-O0 build.
      COVERAGE: '1'
      SCCACHE_GHA_ENABLED: on
      ACTIONS_CACHE_SERVICE_V2: on
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
        fetch-depth: 0
        # Measure the PR's head commit rather than the synthetic merge commit,
        # so the coverage summary reflects the branch as-is. Falls back to the
        # pushed commit for push events.
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - uses: actions/setup-node@v7
      with:
        node-version: '22'
    - uses: mozilla-actions/sccache-action@v0.0.11

    - name: Install build + coverage tooling
      run: |
        pip install cmake ninja "setuptools>=77" sccache nanobind
        pip install pytest pytest-cov gcovr

    # Kick the network-heavy, build-independent test-dependency install off in
    # the background so torch/torchvision (and the rest, all prebuilt wheels)
    # download while the C++ extension below compiles, instead of waiting for the
    # build to finish first. The `wait` before the test step guarantees they are
    # installed before tests run.
    - name: Install test dependencies
      id: test_deps
      background: true
      run: |
        pip install torch==2.10.0 torchvision==0.25.0 --index-url https://download.pytorch.org/whl/cpu/
        pip install flake8 onnxruntime onnxscript==0.6.2 timm==1.0.26 sympy onnx-shape-inference

    - name: Build instrumented extension (editable)
      run: pip install --no-build-isolation -ve .

    - wait: test_deps

    - name: Run tests with combined coverage
      # COV_SKIP_BUILD=1: the extension was already built above.
      env:
        COV_SKIP_BUILD: '1'
      run: bash scripts/coverage/run_coverage.sh

    # JS coverage is independent of the C++/Python build: it runs the
    # convertmodel Node unit tests under c8 (V8 coverage) and emits a Cobertura
    # report, which we drop next to python.xml/cpp.xml as js.xml so the report
    # job below folds all languages into one table.
    - name: Run JS tests with coverage
      working-directory: scripts/convertmodel
      run: |
        npm ci
        npm run coverage
    - name: Collect JS coverage report
      run: |
        cp scripts/convertmodel/coverage/cobertura-coverage.xml coverage-report/js.xml
        cp -r scripts/convertmodel/coverage coverage-report/js-html

    # Hand the reports to the `report` job. Uploading on !cancelled() means a
    # partial run still contributes whatever XML it produced.
    - name: Upload C++/Python/JS coverage
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v7
      with:
        name: coverage-cpp-python-js
        path: coverage-report/

  # Rust line/region/branch coverage for the wrapper crates. It must link the
  # native library (the safe API's tests call into the C ABI), so it takes the
  # documented prebuilt-ONNX-Runtime fast path instead of compiling ORT from
  # source. cargo-llvm-cov instruments only the workspace's own Rust (onnxsim,
  # onnxsim-sys); the C++ core is measured by the job above. It emits a Cobertura
  # report that the `report` job folds into the same combined summary.
  #
  # Runs on the nightly toolchain: branch coverage (`--branch`, which sets
  # -Zcoverage-options=branch) is nightly-only, so the branch-rate column stays
  # empty on stable. Nightly is confined to this job -- rust.yml's lint/build
  # jobs stay on stable.
  rust:
    name: Rust coverage (llvm-cov, prebuilt ORT, nightly)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: rust
    env:
      CMAKE_GENERATOR: Ninja
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
      SCCACHE_GHA_ENABLED: "on"
      ACTIONS_CACHE_SERVICE_V2: "on"
      # Skip compiling ONNX Runtime from source; link a prebuilt release instead.
      # ONNXSIM_ORT_HOME points at the cached, pre-extracted release below so the
      # native build never re-downloads it.
      ONNXSIM_PREBUILT_ORT: "1"
      ONNXSIM_ORT_HOME: ${{ github.workspace }}/rust/prebuilt-ort/onnxruntime-linux-x64-1.29.0
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: mozilla-actions/sccache-action@v0.0.11
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2.87.0
        with:
          tool: cargo-llvm-cov
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      # The prebuilt ONNX Runtime release is a single tarball; cache the extracted
      # tree (keyed by version) so it is downloaded at most once.
      - name: Cache prebuilt ONNX Runtime
        id: ort-cache
        uses: actions/cache@v6
        with:
          path: rust/prebuilt-ort
          key: prebuilt-ort-linux-x64-1.29.0
      - name: Download prebuilt ONNX Runtime
        if: steps.ort-cache.outputs.cache-hit != 'true'
        # Runs in ./rust (this job's default working-directory), so prebuilt-ort
        # here is the rust/prebuilt-ort the cache tracks.
        run: |
          mkdir -p prebuilt-ort
          curl -L --fail --silent --show-error \
            -o /tmp/onnxruntime.tgz \
            https://github.com/microsoft/onnxruntime/releases/download/v1.29.0/onnxruntime-linux-x64-1.29.0.tgz
          tar -xzf /tmp/onnxruntime.tgz -C prebuilt-ort
      # Build + run the tests under instrumentation, accumulating profiles across
      # both the default run and the native-only integration test, then render
      # one combined report. --no-report defers rendering until every test run's
      # profiles are collected.
      # --branch enables branch coverage (nightly-only); it must be set on both
      # the instrumented test runs and the report commands. --ignore-filename-regex
      # drops onnxsim-sys/build.rs: nightly instruments the build script, but its
      # "coverage" only reflects which build path ran (prebuilt ORT), not the
      # tests, so it would be misleading noise in the report.
      - name: Run tests with coverage
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/coverage-report"
          cargo llvm-cov --branch --release --workspace --no-report
          cargo llvm-cov --branch --release --no-report -- --ignored list_optimizers_is_non_empty
          cargo llvm-cov report --branch --release --ignore-filename-regex '(^|/)build\.rs$' \
            --cobertura --output-path "${GITHUB_WORKSPACE}/coverage-report/rust.xml"
          cargo llvm-cov report --branch --release --ignore-filename-regex '(^|/)build\.rs$' \
            --html --output-dir "${GITHUB_WORKSPACE}/coverage-report/rust-html"
          cargo llvm-cov report --branch --release --ignore-filename-regex '(^|/)build\.rs$' --summary-only
      - name: Upload Rust coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-rust
          path: coverage-report/

  # Fold every language's Cobertura report into one summary. Downloading
  # same-workflow artifacts (rather than reaching across workflows) keeps the
  # combined render reliable.
  report:
    name: Combined coverage report
    needs: [cpp-python-js, rust]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    # Each language's report has disjoint filenames, so extracting both artifacts
    # into the same directory merges them into one coverage-report/ tree.
    - name: Download C++/Python/JS coverage
      uses: actions/download-artifact@v8
      with:
        name: coverage-cpp-python-js
        path: coverage-report
    - name: Download Rust coverage
      uses: actions/download-artifact@v8
      with:
        name: coverage-rust
        path: coverage-report

    # Each report's <package name> is auto-derived and cryptic (gcovr -> onnxsim,
    # coverage.py -> main, c8 -> ., cargo-llvm-cov -> onnxsim.src). Relabel them
    # per language so the combined table reads clearly.
    - name: Label coverage packages by language
      run: |
        python3 - <<'PY'
        import os, xml.etree.ElementTree as ET
        labels = {
            "coverage-report/cpp.xml": "C++ (onnxsim core)",
            "coverage-report/python.xml": "Python (onnxsim)",
            "coverage-report/js.xml": "JavaScript (convertmodel)",
            "coverage-report/rust.xml": "Rust (bindings)",
        }
        for path, label in labels.items():
            if not os.path.exists(path):
                continue
            tree = ET.parse(path)
            pkgs = tree.getroot().findall(".//package")
            if len(pkgs) == 1:
                pkgs[0].set("name", label)
            else:
                # Keep multiple packages distinct if a report ever has more.
                for p in pkgs:
                    orig = p.get("name", "")
                    p.set("name", f"{label}: {orig}" if orig and orig != "." else label)
            tree.write(path, xml_declaration=True, encoding="utf-8")
        PY

    - name: Upload combined coverage report artifact
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: coverage-report
        path: coverage-report/

    # Render a combined coverage table from every Cobertura report. irongut
    # accepts a comma-separated file list, so C++, Python, JS and Rust land in
    # one summary. No external service or secret -- output goes only to the
    # job summary (no PR comment, to avoid noisy notifications). fail_below_min
    # stays false so coverage never blocks CI; set it true (with `thresholds`)
    # to enforce a floor.
    - name: Coverage summary (C++ + Python + JS + Rust)
      if: ${{ !cancelled() }}
      uses: irongut/CodeCoverageSummary@v1.3.0
      with:
        filename: coverage-report/cpp.xml,coverage-report/python.xml,coverage-report/js.xml,coverage-report/rust.xml
        badge: true
        format: markdown
        output: both
        hide_complexity: true
        indicators: true
        fail_below_min: false
        thresholds: '50 75'

    # Surface the table in the Actions run's job summary.
    - name: Publish coverage to job summary
      if: ${{ !cancelled() }}
      run: cat code-coverage-results.md >> "$GITHUB_STEP_SUMMARY"
