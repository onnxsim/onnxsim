name: Model Regression

# Runs onnxsim over the large real-world model set characterized in the
# onnxmodelzoo sweep (see scripts/regression/models.json) to catch crashes,
# hangs, and correctness regressions that the unit tests don't exercise — e.g.
# an optimizer pass that aborts on a dynamic-shape detection model.
#
# Each model is also run through onnxslim on the same graph, purely for
# comparison: summarize.py reports where the two simplifiers diverge on
# robustness, node reduction, and speed / peak memory. onnxsim remains the only
# arm that gates the run — an onnxslim failure never turns the workflow red.
#
# Heavy job (~17 GB of downloads, plus sequential simplify work for two tools),
# so it runs on a schedule and on demand rather than on every push. The work is
# split across balanced shards to keep wall-clock down. To switch cadence,
# change the cron below (weekly `0 6 * * 1` vs daily `0 6 * * *`).
#
# The `profile` workflow_dispatch input opts a run into capturing onnxsim's
# ONNXSIM_PROFILE trace for every model (uploaded per-shard, then merged into a
# `profile-summary` artifact by the summary job) -- on by default for a manual
# run, since comparing profiled vs. unprofiled workflow_dispatch runs found
# its overhead low next to onnxslim's own per-model cost; the weekly schedule
# never sets workflow_dispatch inputs at all, so scheduled runs stay
# unprofiled regardless of this default. Pass `profile: false` to opt out of
# a specific manual run.
#
# The finer-grained sibling, onnxsim's ONNXSIM_PROFILE_PASS_PHASES
# per-optimizer-pass match/modify timing table, is captured on every run
# unconditionally (merged into a `profile-pass-phases` artifact) -- unlike
# `profile` its overhead is two chrono reads per node match, no RSS sampler or
# trace write, so it's cheap enough to always have on hand: without it,
# finding which single pass (e.g. extract_constant_to_initializer) dominates a
# slow model means re-running with profiling after the fact instead of just
# reading the last scheduled run. See scripts/regression/README.md#profiling.
# summarize_pass_phases.py aggregates those same tables into a "where to
# optimize next" hint (top passes by summed cost, slowest models, the
# CSETensorHash/CSETensorCompare breakdown) written straight to the Actions
# UI's Summary tab -- see that step in the `summary` job below.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC (weekly). Use "0 6 * * *" for daily.
  workflow_dispatch:
    inputs:
      num_shards:
        description: "Number of parallel shards for the blocking model set"
        default: "6"
        type: string
      include_slow:
        description: "Also run the known-slow models (non-blocking)"
        default: true
        type: boolean
      profile:
        description: "Capture an ONNXSIM_PROFILE trace per model (uploaded as an artifact). Adds overhead (a background RSS sampler + a trace write per model), but that overhead measures low next to onnxslim's own per-model cost -- on by default for a manual run; set false to skip it."
        default: true
        type: boolean
  pull_request:
    # Validate the harness itself whenever it changes.
    paths:
      - ".github/workflows/model-regression.yml"
      - "scripts/regression/**"

concurrency:
  group: model-regression-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Build onnxsim once from the current tree and share the wheel with every
  # shard, instead of rebuilding the C++ extension in each shard job.
  build:
    name: Build onnxsim wheel
    runs-on: ubuntu-24.04
    env:
      SCCACHE_GHA_ENABLED: "on"
      ACTIONS_CACHE_SERVICE_V2: "on"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: Build cp312 wheel
        uses: pypa/cibuildwheel@v4.3.4
        env:
          CIBW_BUILD: "cp312-manylinux_x86_64"
          CIBW_ARCHS: native
          CIBW_BUILD_FRONTEND: "pip; args: --no-build-isolation"
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_ENVIRONMENT_PASS_LINUX: CI SCCACHE_GHA_ENABLED ACTIONS_RESULTS_URL ACTIONS_RUNTIME_TOKEN ACTIONS_CACHE_SERVICE_V2
          CIBW_BEFORE_BUILD: "python3 -m pip install --break-system-packages cmake ninja setuptools sccache nanobind"
          CIBW_ENVIRONMENT: CMAKE_ARGS="-DONNX_USE_PROTOBUF_SHARED_LIBS=OFF" CMAKE_GENERATOR=Ninja CMAKE_CXX_COMPILER_LAUNCHER=sccache CMAKE_LINKER_TYPE=LLD
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: "auditwheel repair -w {dest_dir} {wheel} --strip"
      - uses: actions/upload-artifact@v7
        with:
          name: onnxsim-wheel
          path: ./wheelhouse/*.whl

  # Emit the shard index list so the shard count is configurable from
  # workflow_dispatch while defaulting to 6, and whether models.json currently
  # has any known_slow entries at all -- lets the known-slow job below skip
  # itself (checkout, wheel download, deps install, all for nothing) on the
  # common case where the list is empty rather than always paying that
  # overhead to report "0 models, all passed".
  # A sparse checkout of just models.json keeps this cheap; ubuntu-slim's
  # preinstalled Python is all the rest needs.
  setup:
    name: Plan shards
    runs-on: ubuntu-slim
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      num_shards: ${{ steps.plan.outputs.num_shards }}
      has_known_slow: ${{ steps.plan.outputs.has_known_slow }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts/regression/models.json
          sparse-checkout-cone-mode: false
      - id: plan
        run: |
          n="${{ github.event.inputs.num_shards || '6' }}"
          shards=$(python3 -c "import json,sys; print(json.dumps(list(range(int(sys.argv[1])))))" "$n")
          echo "num_shards=$n" >> "$GITHUB_OUTPUT"
          echo "shards=$shards" >> "$GITHUB_OUTPUT"
          echo "planning $n shards: $shards"
          has_slow=$(python3 -c "import json; d=json.load(open('scripts/regression/models.json')); print('true' if any(m.get('known_slow') for m in d['models']) else 'false')")
          echo "has_known_slow=$has_slow" >> "$GITHUB_OUTPUT"
          echo "known_slow models present: $has_slow"

  regression:
    name: Shard ${{ matrix.shard }}
    needs: [build, setup]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      NUM_SHARDS: ${{ needs.setup.outputs.num_shards }}
      HF_HUB_ENABLE_HF_TRANSFER: "0"
      # Authenticated downloads get their own rate-limit bucket, which helps
      # with the intermittent connection resets anonymous access to the Hub
      # sometimes hits under load. huggingface_hub picks this up automatically.
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      PROFILE: ${{ github.event.inputs.profile == 'true' && '1' || '' }}
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.setup.outputs.shards) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          name: onnxsim-wheel
          path: wheelhouse
      - name: Install onnxsim wheel + deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install onnxruntime huggingface_hub onnxslim
          python -m pip install wheelhouse/*.whl
      - name: Verify the installed wheel is used (not the source tree)
        working-directory: ${{ runner.temp }}
        run: python -c "import onnxsim, onnxsim.onnxsim_cpp2py_export as m; print(onnxsim.__version__, m.__file__)"
      - name: Run regression shard
        working-directory: ${{ runner.temp }}
        run: |
          profile_args=()
          if [ -n "$PROFILE" ]; then
            profile_args+=(--profile-dir profiles)
          fi
          python "$GITHUB_WORKSPACE/scripts/regression/run_regression.py" \
            --shard "${{ matrix.shard }}" \
            --num-shards "$NUM_SHARDS" \
            --timeout 900 \
            --output "shard-${{ matrix.shard }}.csv" \
            --profile-pass-phases-dir pass_phases \
            "${profile_args[@]}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: regression-csv-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/shard-${{ matrix.shard }}.csv
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: regression-profiles-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/profiles
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: regression-pass-phases-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/pass_phases
          if-no-files-found: ignore

  known-slow:
    name: Known-slow models (non-blocking)
    needs: [build, setup]
    if: ${{ needs.setup.outputs.has_known_slow == 'true' && (github.event_name != 'workflow_dispatch' || github.event.inputs.include_slow == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    continue-on-error: true
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      PROFILE: ${{ github.event.inputs.profile == 'true' && '1' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          name: onnxsim-wheel
          path: wheelhouse
      - name: Install onnxsim wheel + deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install onnxruntime huggingface_hub onnxslim
          python -m pip install wheelhouse/*.whl
      - name: Run known-slow models
        working-directory: ${{ runner.temp }}
        run: |
          profile_args=()
          if [ -n "$PROFILE" ]; then
            profile_args+=(--profile-dir profiles)
          fi
          python "$GITHUB_WORKSPACE/scripts/regression/run_regression.py" \
            --slow-only \
            --timeout 2400 \
            --output "slow.csv" \
            --profile-pass-phases-dir pass_phases \
            "${profile_args[@]}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: regression-csv-slow
          path: ${{ runner.temp }}/slow.csv
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: regression-profiles-slow
          path: ${{ runner.temp }}/profiles
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: regression-pass-phases-slow
          path: ${{ runner.temp }}/pass_phases
          if-no-files-found: ignore

  summary:
    name: Summary
    needs: [regression, known-slow]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write # open/update/close the failure-tracking issue
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          pattern: regression-csv-*
          path: csvs
          merge-multiple: true
      # Writes regression-report.csv + regression-summary.md, appends the run
      # summary, and sets outputs.status=pass|fail. Kept from failing the step
      # here (continue-on-error) so the issue-reporting step always runs; the
      # final step re-raises the failure to keep the workflow red.
      - name: Build summary
        id: sum
        continue-on-error: true
        run: python "$GITHUB_WORKSPACE/scripts/regression/summarize.py" "csvs/*.csv"
      # Profile artifacts only exist when the "profile" workflow_dispatch input
      # was set (see the regression/known-slow jobs above); a normal scheduled
      # run has none, so this whole block is a no-op then.
      - uses: actions/download-artifact@v8
        with:
          pattern: regression-profiles-*
          path: profiles
          merge-multiple: true
      - name: Build profile summary
        if: always()
        continue-on-error: true
        run: |
          if find profiles -name '*.json' -print -quit 2>/dev/null | grep -q .; then
            python "$GITHUB_WORKSPACE/scripts/regression/summarize_profiles.py" "profiles/*.json" --csv "csvs/*.csv"
          else
            echo "no profile traces present (profiling was not requested for this run)"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: profile-summary
          path: profile-summary.md
          if-no-files-found: ignore
      # Pass-phase text tables are captured unconditionally by every
      # regression/known-slow job (see run_regression.py's
      # --profile-pass-phases-dir default), so this block always has
      # something to collect. No dedicated summarizer for these -- they're
      # onnxsim's own already-formatted stderr tables, so just collect them
      # into one file per run instead of parsing/re-rendering them.
      - uses: actions/download-artifact@v8
        with:
          pattern: regression-pass-phases-*
          path: pass_phases
          merge-multiple: true
      - name: Build pass-phase profile digest
        if: always()
        continue-on-error: true
        run: |
          if find pass_phases -name '*.pass_phases.txt' -print -quit 2>/dev/null | grep -q .; then
            {
              echo "# ONNXSIM_PROFILE_PASS_PHASES digest"
              echo
              for f in pass_phases/*.pass_phases.txt; do
                echo "## $(basename "$f" .pass_phases.txt)"
                echo '```'
                cat "$f"
                echo '```'
                echo
              done
            } > pass-phase-profiles.md
            # Also to the job log itself, not just the artifact -- readable
            # straight from the Actions UI (or the API) without a download.
            cat pass-phase-profiles.md
          else
            echo "no pass-phase tables present (unexpected -- every job captures them by default; check for an upstream failure)"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: profile-pass-phases
          path: pass-phase-profiles.md
          if-no-files-found: ignore
      # Unlike the raw digest above (every model's table, verbatim -- useful
      # for a deep dive but not something anyone reads end to end),
      # summarize_pass_phases.py aggregates across the whole run: which pass
      # costs the most summed across models, which model(s) are the slowest,
      # and the CSETensorHash/CSETensorCompare breakdown that's twice now
      # been the actual next bottleneck once the top-ranked pass got fixed
      # (onnxsim#717, #720). Written to $GITHUB_STEP_SUMMARY so it shows up
      # directly in the Actions UI's Summary tab -- no log-digging or
      # artifact download needed to see where to optimize next.
      - name: Build pass-phase bottleneck summary
        if: always()
        continue-on-error: true
        run: |
          if find pass_phases -name '*.pass_phases.txt' -print -quit 2>/dev/null | grep -q .; then
            python "$GITHUB_WORKSPACE/scripts/regression/summarize_pass_phases.py" "pass_phases/*.pass_phases.txt"
          else
            echo "no pass-phase tables present (unexpected -- every job captures them by default; check for an upstream failure)"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pass-phase-bottleneck-summary
          path: pass-phase-summary.md
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: regression-report
          path: |
            regression-report.csv
            regression-summary.md
          if-no-files-found: ignore
      # On a scheduled/manual run, file (or update) a tracking issue when the
      # regression fails, and close it when it goes green again. Skipped on
      # pull_request runs, which only validate the harness.
      - name: Report result to tracking issue
        if: ${{ always() && github.event_name != 'pull_request' }}
        uses: actions/github-script@v9
        env:
          STATUS: ${{ steps.sum.outputs.status }}
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const status = process.env.STATUS || 'fail';
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${owner}/${repo}/actions/runs/${context.runId}`;
            const TITLE = 'Weekly model regression failing';
            let report = '';
            try { report = fs.readFileSync('regression-summary.md', 'utf8'); } catch (e) {}
            const footer = `\n\n[Full run, logs & CSV artifacts](${runUrl})\n\n_Filed automatically by the Model Regression workflow._`;

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', per_page: 100,
            });
            const existing = issues.find(i => i.title === TITLE && !i.pull_request);

            if (status === 'fail') {
              const body = report + footer;
              if (existing) {
                await github.rest.issues.update({ owner, repo, issue_number: existing.number, body });
                await github.rest.issues.createComment({
                  owner, repo, issue_number: existing.number,
                  body: `Still failing as of ${runUrl}` + footer,
                });
                core.notice(`Updated regression issue #${existing.number}`);
              } else {
                const created = await github.rest.issues.create({ owner, repo, title: TITLE, body });
                core.notice(`Opened regression issue #${created.data.number}`);
              }
            } else if (existing) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: existing.number,
                body: `✅ Regression green again as of ${runUrl}. Closing.` + footer,
              });
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, state: 'closed' });
              core.notice(`Closed regression issue #${existing.number}`);
            }
      # Re-raise the failure the summary step swallowed, so the workflow is red.
      - name: Fail if regression failed
        if: ${{ steps.sum.outputs.status == 'fail' }}
        run: |
          echo "::error::Model regression had blocking failures"
          exit 1
