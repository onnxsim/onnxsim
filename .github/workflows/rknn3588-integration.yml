name: RK3588 Real-NPU Integration

# Runs onnxsim's original-vs-simplified check on *real* RK3588 silicon rather
# than rknn-toolkit2's PC simulator: both graphs are compiled with
# target_platform="rk3588", uploaded to a NanoPC-T6 over SSH, and executed on
# the board's actual NPU through librknnrt.so, then compared.
#
# Unlike the RKNN Integration workflow (scripts/rknn/run_rknn_compat.py), this
# one needs physical hardware. The board is reached through Tailscale, so the
# credentials are repository secrets and the job only runs where that tailnet
# is reachable -- it is deliberately not on pull_request.
#
# Required repository secrets:
#   RKNN_3588_HOST       e.g. nanopc-t6.tailf0b7b1.ts.net
#   RKNN_3588_USER       board user (default: pi)
#   RKNN_SSH_PASSWORD    board password

on:
  workflow_dispatch:
  schedule:
    # Sundays 06:00 UTC -- before the simulator-only RKNN job on Mondays.
    - cron: "0 6 * * 0"

concurrency:
  group: rknn3588-integration-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build onnxsim wheel
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: Build cp312 wheel
        uses: pypa/cibuildwheel@v4.2.1
        env:
          CIBW_BUILD: "cp312-manylinux_x86_64"
          CIBW_ARCHS: native
          CIBW_BUILD_FRONTEND: "pip; args: --no-build-isolation"
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_ENVIRONMENT_PASS_LINUX: CI SCCACHE_GHA_ENABLED ACTIONS_RESULTS_URL ACTIONS_RUNTIME_TOKEN ACTIONS_CACHE_SERVICE_V2
          CIBW_BEFORE_BUILD: "python3 -m pip install --break-system-packages cmake ninja setuptools sccache nanobind"
          CIBW_ENVIRONMENT: CMAKE_ARGS="-DONNX_USE_PROTOBUF_SHARED_LIBS=OFF" CMAKE_GENERATOR=Ninja CMAKE_CXX_COMPILER_LAUNCHER=sccache CMAKE_LINKER_TYPE=LLD
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: "auditwheel repair -w {dest_dir} {wheel} --strip"
      - uses: actions/upload-artifact@v7
        with:
          name: onnxsim-wheel-rknn3588
          path: ./wheelhouse/*.whl

  rknn3588:
    name: RK3588 real-NPU check
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # rknn-toolkit2 ships cp310/cp311/cp312 x86-64 Linux wheels.
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          name: onnxsim-wheel-rknn3588
          path: wheelhouse
      - name: Install onnxsim wheel + rknn-toolkit2
        run: |
          python -m pip install --upgrade pip
          # rknn-toolkit2 2.3.2 imports pkg_resources at RKNN() construction,
          # which setuptools>=81 no longer ships.
          python -m pip install "setuptools<81" rknn-toolkit2
          python -m pip install wheelhouse/*.whl
      # Run from runner.temp, not the checkout: the repo root contains the
      # uncompiled `onnxsim/` source dir, which would shadow the installed wheel.
      - name: Check the board is reachable
        working-directory: ${{ runner.temp }}
        env:
          RKNN_3588_HOST: ${{ secrets.RKNN_3588_HOST }}
          RKNN_3588_USER: ${{ secrets.RKNN_3588_USER }}
          RKNN_SSH_PASSWORD: ${{ secrets.RKNN_SSH_PASSWORD }}
        run: |
          if [ -z "$RKNN_3588_HOST" ]; then
            echo "RKNN_3588_HOST secret is not set; skipping hardware job."
            exit 0
          fi
          sshpass -p "$RKNN_SSH_PASSWORD" ssh \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR \
            "${RKNN_3588_USER:-pi}@$RKNN_3588_HOST" \
            'ls -l /usr/lib/librknnrt.so; cat /sys/kernel/debug/rknpu/version 2>/dev/null || true'
      - name: Run RK3588 real-NPU compatibility check
        working-directory: ${{ runner.temp }}
        env:
          RKNN_3588_HOST: ${{ secrets.RKNN_3588_HOST }}
          RKNN_3588_USER: ${{ secrets.RKNN_3588_USER }}
          RKNN_SSH_PASSWORD: ${{ secrets.RKNN_SSH_PASSWORD }}
        run: |
          if [ -z "$RKNN_3588_HOST" ]; then
            echo "RKNN_3588_HOST secret is not set; skipping hardware job."
            exit 0
          fi
          python "$GITHUB_WORKSPACE/scripts/rknn/run_rknn3588_compat.py" \
            --host "$RKNN_3588_HOST" \
            --user "${RKNN_3588_USER:-pi}" \
            --output rknn3588-compat.csv
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rknn3588-compat-report
          path: ${{ runner.temp }}/rknn3588-compat.csv
          if-no-files-found: ignore