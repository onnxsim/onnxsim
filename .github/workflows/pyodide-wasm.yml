# Builds onnxsim's nanobind Python extension (`onnxsim_cpp2py_export`) for
# Pyodide / wasm32-emscripten via `build_wasm_pyodide.sh`, then actually loads
# the resulting `.abi3.so` inside a real Pyodide runtime (the `pyodide` npm
# package, run under Node) and confirms it imports and runs. See
# docs/wasm_pyodide.md for the full story of why this build needs the
# toolchain pinning below, and its Status section for what is/isn't verified.
#
# This is a THIRD, separate build path from the Python wheel (setup.py) and
# the standalone WASM CLI (build_wasm.sh / static.yml) -- see CLAUDE.md and
# build_wasm_pyodide.sh's own header comment. It does not touch either.
#
# Toolchain pins, and why (see docs/wasm_pyodide.md for the full detail):
#   - Emscripten 4.0.9: pyodide-build's own default Emscripten (3.1.46,
#     clang-18) fails to compile onnxsim's vendored protobuf 31.1 (a
#     `constinit` compile-time-evaluation limit in that old clang) -- any
#     newer Emscripten avoids it. 4.0.9 is specifically the version Pyodide
#     release 0.29.4 itself was built with.
#   - Pyodide release 0.29.4: this is the load-bearing pin. Its ABI epoch
#     (`sysconfig.get_config_var("PYODIDE_ABI_VERSION")` -> `2025_0`) is the
#     SAME epoch PyPI's `onnx` wheel is tagged for
#     (`onnx-*-pyemscripten_2025_0_wasm32.whl`) -- confirmed by loading onnx's
#     real compiled extension in this exact runtime. A later Pyodide release
#     (e.g. 314.0.5, epoch `2026_0`) compiles onnxsim fine too, but produces a
#     module ABI-incompatible with onnx's only published wasm wheel, which is
#     what actually blocks running full `onnxsim.simplify()` (needs `onnx`)
#     rather than just the compiled extension alone. Pin this xbuildenv/npm
#     package version, not "whatever's current", so this stays matched.
name: Pyodide / wasm32-emscripten build

# `onnxsim/**` below still needs `!onnxsim/**/*.py` next to it: this build
# only compiles onnxsim's C++ core into the nanobind extension, so a
# Python-only change under onnxsim/ (or elsewhere) doesn't affect it.
on:
  pull_request:
    paths: &pyodide-wasm-paths
      - ".github/workflows/pyodide-wasm.yml"
      - "build_wasm_pyodide.sh"
      - "docs/wasm_pyodide.md"
      - "scripts/pyodide_smoke_test.mjs"
      - "scripts/pyodide_demo/**"
      - "scripts/convertmodel/test/model.onnx"
      - "CMakeLists.txt"
      - "cmake/**"
      - "onnxsim/**"
      - "!onnxsim/**/*.py"
      - ".gitmodules"
  push:
    branches: ["master"]
    paths: *pyodide-wasm-paths
  workflow_dispatch:

permissions:
  contents: read

# One run per ref at a time; a newer push/PR update supersedes an in-flight
# run of the same ref rather than queuing behind it.
concurrency:
  group: "pyodide-wasm-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build + Pyodide/Node integration test
    # The full C++ compile (abseil/protobuf/onnx/onnx-optimizer/onnxsim, all
    # for wasm32) needs real CPU/RAM, matching what static.yml uses for its
    # own, comparably-sized wasm build.
    runs-on: ubuntu-latest
    env:
      CMAKE_GENERATOR: Ninja
      EMSCRIPTEN_VERSION: "4.0.9"
      PYODIDE_VERSION: "0.29.4"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      # The TARGET Python minor version (3.13, matching PYODIDE_VERSION's
      # CPython) -- also used as the HOST interpreter build_wasm_pyodide.sh
      # shells out to for `nanobind --cmake_dir` and that onnx-optimizer's
      # combined find_package(Python...) call runs directly. Their minor
      # versions must match (see build_wasm_pyodide.sh's header comment), so
      # this one interpreter serves both roles.
      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - run: pip install cmake ninja nanobind pyodide-build setuptools

      # --- Host protoc -----------------------------------------------------
      # Same requirement as build_wasm.sh/static.yml's protoc handling:
      # CMake's ONNX_CUSTOM_PROTOC_EXECUTABLE needs a host protoc whose
      # codegen matches the vendored protobuf runtime being linked. onnxsim's
      # own CMake FetchContent pulls protobuf 31.1 for onnx/onnx-optimizer
      # (see third_party/onnx/sbom.cdx.json) -- the SAME version static.yml
      # already downloads a prebuilt binary for (there for the separate
      # ORT-web wasm build's bundled protobuf 6.31.1, which is the same
      # release). Reusing a version-matched prebuilt binary here too, rather
      # than building protoc from source (build_wasm_pyodide.sh's fallback
      # when protoc isn't already on PATH), saves ~15 minutes per run.
      - name: Install protoc 31.1 (matches onnxsim's vendored protobuf)
        run: |
          PROTOC_VERSION=31.1
          curl -sSL -o /tmp/protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          sudo unzip -o /tmp/protoc.zip -d /usr/local bin/protoc 'include/*'
          sudo chmod +x /usr/local/bin/protoc
          protoc --version

      # --- Pyodide xbuildenv (target Python headers) -----------------------
      # A real download (tens of MB), so cache it -- keyed on the installed
      # pyodide-build's version too, since xbuildenv install compatibility is
      # checked against it.
      - name: Get installed pyodide-build version
        id: pyodide-build-version
        run: |
          echo "version=$(python -m pip show pyodide-build | sed -n 's/^Version: //p')" >> "$GITHUB_OUTPUT"
      - name: Cache Pyodide xbuildenv
        id: xbuildenv-cache
        uses: actions/cache@v6
        with:
          path: .pyodide-xbuildenv
          key: pyodide-xbuildenv-${{ env.PYODIDE_VERSION }}-pyodide-build-${{ steps.pyodide-build-version.outputs.version }}
      - name: Install Pyodide xbuildenv ${{ env.PYODIDE_VERSION }}
        if: steps.xbuildenv-cache.outputs.cache-hit != 'true'
        run: pyodide xbuildenv install "${PYODIDE_VERSION}" --path .pyodide-xbuildenv
      - name: Locate the target Python headers in the xbuildenv
        run: |
          PYODIDE_PYTHON_INCLUDE=$(find "$PWD/.pyodide-xbuildenv" -type d -path "*/include/python3.13*" | head -1)
          if [ -z "$PYODIDE_PYTHON_INCLUDE" ]; then
            echo "::error::could not find a python3.13* headers dir under .pyodide-xbuildenv (xbuildenv install broken/incomplete?)" >&2
            find "$PWD/.pyodide-xbuildenv" -maxdepth 6 -type d
            exit 1
          fi
          echo "PYODIDE_PYTHON_INCLUDE=${PYODIDE_PYTHON_INCLUDE}" >> "$GITHUB_ENV"
          echo "found target Python headers at ${PYODIDE_PYTHON_INCLUDE}"

      # --- ccache (same pattern as static.yml) ------------------------------
      - name: Prepare ccache timestamp
        id: ccache_cache_timestamp
        run: echo "timestamp=$(date -Iseconds)" >> "${GITHUB_OUTPUT}"
      - name: ccache cache files
        uses: actions/cache@v6
        with:
          path: .ccache
          key: pyodide-wasm-ccache-${{ steps.ccache_cache_timestamp.outputs.timestamp }}
          restore-keys: |
              pyodide-wasm-ccache-
      - run: |
          sudo apt install -y ccache
          which ccache
          ccache -z
          echo "CCACHE_DIR=${PWD}/.ccache" >> "${GITHUB_ENV}"
          echo "CCACHE_MAXSIZE=500M" >> "${GITHUB_ENV}"
          echo "_EMCC_CCACHE=1" >> "${GITHUB_ENV}"

      # --- emsdk (same clone+install+activate pattern as static.yml) -------
      - name: Install emsdk ${{ env.EMSCRIPTEN_VERSION }}
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git
          ./emsdk/emsdk install "${EMSCRIPTEN_VERSION}"
          ./emsdk/emsdk activate "${EMSCRIPTEN_VERSION}"

      - name: Build onnxsim's Pyodide side module
        run: |
          . ./emsdk/emsdk_env.sh
          export PYTHON_EXECUTABLE=python3
          ./build_wasm_pyodide.sh
          echo "SO_PATH=${PWD}/build-wasm-pyodide/onnxsim_cpp2py_export.abi3.so" >> "$GITHUB_ENV"

      - name: ccache statistics
        if: always()
        run: ccache -s

      # --- Structural sanity check ------------------------------------------
      # The script's own last line already confirms this by construction
      # (it discovers PyInit_... from the object file to build
      # -sEXPORTED_FUNCTIONS), but check independently here so a change to
      # the script that silently breaks this fails the job loudly rather than
      # only being caught (confusingly) by the import test below.
      - name: Sanity-check the built module (WebAssembly binary, exports PyInit_onnxsim_cpp2py_export)
        run: |
          test -f "${SO_PATH}" || { echo "::error::expected build output not found at ${SO_PATH}"; exit 1; }
          file "${SO_PATH}"
          file "${SO_PATH}" | grep -qi "WebAssembly" || { echo "::error::${SO_PATH} is not reported as a WebAssembly binary"; exit 1; }
          . ./emsdk/emsdk_env.sh
          NM=$(command -v llvm-nm || true)
          if [ -z "${NM}" ]; then
            echo "::warning::llvm-nm not found on PATH after activating emsdk -- skipping export symbol check"
          else
            "${NM}" "${SO_PATH}" | grep -q "T PyInit_onnxsim_cpp2py_export" || {
              echo "::error::${SO_PATH} does not export PyInit_onnxsim_cpp2py_export"
              exit 1
            }
            echo "confirmed: ${SO_PATH} exports PyInit_onnxsim_cpp2py_export"
          fi

      # onnxsim/version.py is gitignored and generated by setup.py's
      # `create_version` command (see setup.py) -- normal `pip install .` /
      # `python setup.py build` runs always generate it first, but this
      # workflow builds the wasm extension directly via CMake and never
      # touches setup.py, so a fresh checkout has no version.py at all.
      # pyodide_smoke_test.mjs's Phase 2 copies the WHOLE onnxsim/ directory
      # (to run a real `import onnxsim`), and onnx_simplifier.py does
      # `from . import ..., version` -- generate it explicitly so that
      # import doesn't fail on a missing submodule.
      - name: Generate onnxsim/version.py (setup.py never runs in this workflow)
        run: python setup.py create_version

      # --- Integration test: load it in a real Pyodide/Node runtime --------
      # This is the actual new coverage this workflow adds: everything above
      # only checks the module's shape, never that it loads and runs.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install the pyodide npm package (pinned to ${{ env.PYODIDE_VERSION }})
        run: |
          mkdir -p /tmp/pyodide-smoke-test-env
          cd /tmp/pyodide-smoke-test-env
          npm install --no-save "pyodide@${PYODIDE_VERSION}"
          # Node resolves a bare `import "pyodide"` relative to the script's
          # own location, not the process cwd -- copy the test script next to
          # the node_modules/ we just installed rather than running it from
          # its checkout path.
          cp "${GITHUB_WORKSPACE}/scripts/pyodide_smoke_test.mjs" .
      - name: Import the built module under Pyodide and call a real binding
        run: |
          cd /tmp/pyodide-smoke-test-env
          node ./pyodide_smoke_test.mjs "${SO_PATH}" "${GITHUB_WORKSPACE}/onnxsim"

      # --- Browser UI smoke test -------------------------------------------
      # Test the page users actually load, not only the extension under Node.
      # The page is staged exactly like static.yml stages it for deployment,
      # then served over HTTP because the UI fetches its .so and Python files.
      - name: Stage the Pyodide demo for browser testing
        run: |
          DEMO_ROOT="${RUNNER_TEMP}/pyodide-demo"
          rm -rf "${DEMO_ROOT}"
          mkdir -p "${DEMO_ROOT}/onnxsim_src"
          cp scripts/pyodide_demo/index.html "${DEMO_ROOT}/"
          cp "${SO_PATH}" "${DEMO_ROOT}/onnxsim_cpp2py_export.abi3.so"
          cp scripts/convertmodel/test/model.onnx "${DEMO_ROOT}/model.onnx"
          cp onnxsim/*.py "${DEMO_ROOT}/onnxsim_src/"
          python - <<'PY' > "${DEMO_ROOT}/onnxsim_src/files.json"
          import json
          from pathlib import Path
          print(json.dumps(sorted(p.name for p in Path("onnxsim").glob("*.py"))))
          PY
          echo "DEMO_ROOT=${DEMO_ROOT}" >> "$GITHUB_ENV"

      - name: Install Playwright and Chromium
        working-directory: scripts/pyodide_demo
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run the Pyodide demo in Chromium
        working-directory: scripts/pyodide_demo
        env:
          PLAYWRIGHT_SCREENSHOT: ${{ runner.temp }}/pyodide-demo-failure.png
        run: node browser_test.mjs "${DEMO_ROOT}" "${DEMO_ROOT}/model.onnx"

      - name: Upload browser failure screenshot
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pyodide-demo-browser-failure
          path: ${{ runner.temp }}/pyodide-demo-failure.png
          if-no-files-found: ignore

      # scripts/pyodide_demo/index.html fetches this module at runtime rather
      # than it being committed (it's gitignored like every other *.so in this
      # repo) -- upload it here so a reviewer/user can download a fresh build
      # straight from the Actions run and drop it next to that page, without
      # needing the wasm toolchain locally. See docs/wasm_pyodide.md's Demo
      # section for the exact steps.
      - name: Upload the built module as a workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: onnxsim_cpp2py_export-wasm32-pyodide-${{ env.PYODIDE_VERSION }}
          path: ${{ env.SO_PATH }}
          retention-days: 30
