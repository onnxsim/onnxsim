name: Build and Test

on:
  push:
    branches:
      - main
      - master
  pull_request:
  release:
    types: [published]
  # Lets build_wheel_pyodide (which otherwise only runs on push/release, see
  # its own comment) be exercised against a PR branch before merge -- same
  # rationale as pyodide-wasm.yml and static.yml's own workflow_dispatch
  # triggers.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_wheels:
    env:
      CIBW_ARCHS: native
      CIBW_BUILD_FRONTEND: "pip; args: --no-build-isolation"
      CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
      # GITHUB_EVENT_NAME/GITHUB_REF are forwarded so tests/test_timm.py can tell
      # a master-branch push from a pull request inside the manylinux container.
      CIBW_ENVIRONMENT_PASS_LINUX: CI SCCACHE_GHA_ENABLED ACTIONS_RESULTS_URL ACTIONS_RUNTIME_TOKEN ACTIONS_CACHE_SERVICE_V2 ONNXSIM_RELEASE GITHUB_EVENT_NAME GITHUB_REF
      CIBW_BEFORE_BUILD: "python3 -m pip install --break-system-packages cmake ninja setuptools sccache nanobind"
      # z3-solver is intentionally NOT installed on any of these per-platform/
      # per-Python legs: tests/test_formal_verify_*.py's own shared helper
      # (tests/_formal_verify_common.py) does `pytest.importorskip("z3")`, so
      # without it those ~1000 Z3 proof tests are skipped here, not run --
      # they'd otherwise re-run identically (same Z3 queries, same Python
      # differential logic, no OS/arch/interpreter dependence) on every one of
      # this matrix's legs, adding ~10 minutes to each for no additional
      # coverage. They run exactly once instead, in the dedicated
      # test_formal_verification job below (also why z3-solver's own missing
      # linux/aarch64 wheel -- manylinux_2_38, newer glibc than this job's
      # manylinux_2_28 image provides -- was never actually a concern for that
      # job specifically: it doesn't install z3-solver at all).
      CIBW_TEST_REQUIRES: pytest flake8 onnxruntime onnxscript==0.6.2 timm==1.0.26 sympy onnx-shape-inference onnxslim onnx_safetensors
      CIBW_BEFORE_TEST: pip install torch==2.10.0 torchvision==0.25.0 --index-url https://download.pytorch.org/whl/cpu/
      CIBW_TEST_COMMAND: pytest -v ${{ matrix.pytest_args }} {project}/tests && onnxsim -h && onnxsim --list-default-optimizers
      # Only build on Python 3 and skip 32-bit or musl builds
      CIBW_SKIP: "*-win32 *-manylinux_i686 *-musllinux_*"
      # The extension is built RelWithDebInfo (see setup.py) so the sanitizer
      # job gets symbolized traces, but GCC embeds that DWARF straight into the
      # Linux .so, bloating each manylinux wheel ~18x (~3 MB -> ~51 MB). Strip
      # the debug symbols when repairing the released wheels; the sanitizer
      # workflow builds separately and keeps its symbols.
      CIBW_REPAIR_WHEEL_COMMAND_LINUX: "auditwheel repair -w {dest_dir} {wheel} --strip"
      # onnx 1.23+ uses std::to_chars in its text printer, which libc++ only
      # exposes from macOS 13.3; match the deployment target onnx itself ships
      # its wheels with so both the compile and the delocate/tag step agree.
      CIBW_ENVIRONMENT: MACOSX_DEPLOYMENT_TARGET=13.3 CMAKE_ARGS="-DONNX_USE_PROTOBUF_SHARED_LIBS=OFF" CMAKE_GENERATOR=Ninja CMAKE_CXX_COMPILER_LAUNCHER=sccache CMAKE_LINKER_TYPE=LLD
      SCCACHE_GHA_ENABLED: on
      ACTIONS_CACHE_SERVICE_V2: on
    name: Build wheel ${{ matrix.py_ver }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Windows wheels are built by cross-compiling on Ubuntu (see the
        # build_wheels_windows_cross / test_wheels_windows_cross jobs below),
        # not natively here.
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
        # Full Python coverage on push/release; a reduced set on pull_request to
        # cut CI jobs. cp311 exercises a version-specific (below-abi3-floor)
        # wheel and cp312 the abi3 wheel that also serves 3.13/3.14, so cp313
        # adds no distinct build coverage on PRs. The free-threaded cp314t
        # job (via include below) still runs on every event.
        py_ver: ${{ github.event_name == 'pull_request' && fromJSON('["cp311", "cp312"]') || fromJSON('["cp311", "cp312", "cp313"]') }}
        include:
          - os: ubuntu-24.04
            py_ver: cp314t
            # test_ext allocates a ~2 GiB fp16 tensor and OOM-kills the
            # free-threaded runner (SIGKILL / exit 137), just as it does on the
            # Windows runner (see test_wheels_windows_cross). Skip it here; the
            # same test still runs on the cp311-cp313 jobs (cp311/cp312 on PRs).
            pytest_args: '-k "not test_ext"'
        # macOS runners are the slowest/most contended in this matrix; a pull
        # request only needs one macOS build to confirm the platform still
        # works, so drop it down to the oldest supported version there. push
        # and release still need full coverage, so this only fires for the
        # 'pull_request' trigger.
        exclude: ${{ github.event_name == 'pull_request' && fromJSON('[{"os":"macos-15","py_ver":"cp312"}]') || fromJSON('[]') }}
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
        fetch-depth: 0
    - uses: mozilla-actions/sccache-action@v0.0.11
    - name: Update version
      if: startsWith(github.ref, 'refs/tags/v')
      run: echo "ONNXSIM_RELEASE=${{ github.ref_name }}" >> ${GITHUB_ENV}
    - name: Build onnxsim wheels
      uses: pypa/cibuildwheel@v4.2.0
      env:
        CIBW_BUILD: "${{ matrix.py_ver }}-*"
    - name: Check ABI3
      run: |
        pip install abi3audit
        abi3audit --strict -v --report ./wheelhouse/*.whl
      if: ${{ contains(fromJSON('["cp312", "cp313"]'), matrix.py_ver) }}
    - uses: actions/upload-artifact@v7
      with:
        name: python-dist-${{ matrix.os }}-${{ matrix.py_ver }}
        path: ./wheelhouse/*.whl
      if: ${{ !contains(fromJSON('["cp313"]'), matrix.py_ver) }}

  # Runs onnxsim's Z3-based translation-validation proof suite
  # (tests/test_formal_verify_*.py, plus test_fusion_patterns.py and
  # test_ort_matmul_nbits_workaround.py) exactly ONCE, against the already-
  # built ubuntu-24.04/cp312 wheel -- these tests are otherwise skipped (via
  # tests/_formal_verify_common.py's own `pytest.importorskip("z3")`) on every
  # build_wheels/test_wheels_windows_cross leg, since the Z3 queries and
  # differential logic they exercise have no OS/arch/interpreter dependence:
  # running the same ~10-minute suite identically on every wheel platform
  # would just multiply CI cost with no additional coverage.
  test_formal_verification:
    name: Formal verification (Z3 translation-validation proofs)
    needs: build_wheels
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        # No submodules/full history needed -- only tests/ is read here, and
        # the wheel downloaded below already has the compiled extension.
      - uses: actions/download-artifact@v8
        with:
          # Matches build_wheels' own upload-artifact naming; ubuntu-24.04 +
          # cp312 is always built (PRs included -- see build_wheels' own
          # py_ver matrix), so this leg is always available to depend on.
          name: python-dist-ubuntu-24.04-cp312
          path: wheelhouse
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install onnxsim wheel + formal-verification test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest onnxruntime ml_dtypes z3-solver
          python -m pip install wheelhouse/onnxsim-*.whl
      # Run from a neutral directory (matching test_wheels_windows_cross's own
      # established fix for the identical problem): the repo root's own
      # ./onnxsim/ source package (a plain Python package directory, no
      # compiled extension) would otherwise shadow the installed wheel on
      # sys.path, since Python prepends the current directory -- pytest still
      # finds pyproject.toml's [tool.pytest.ini_options] and tests/'s own
      # sibling-module imports (e.g. _formal_verify_common) by walking up from
      # the absolute test paths given below, so nothing else needs to change.
      - name: Verify onnxsim under test is the built wheel
        working-directory: ${{ runner.temp }}
        run: python -c "import onnxsim, onnxsim.onnxsim_cpp2py_export as m; print('onnxsim', onnxsim.__version__); print(m.__file__)"
      - name: Run Z3 formal-verification proof suite
        working-directory: ${{ runner.temp }}
        run: |
          pytest -v "${GITHUB_WORKSPACE}"/tests/test_formal_verify_*.py "${GITHUB_WORKSPACE}/tests/test_fusion_patterns.py" "${GITHUB_WORKSPACE}/tests/test_ort_matmul_nbits_workaround.py"

  # Windows wheels are cross-compiled on a cheap Ubuntu runner with llvm-mingw
  # (clang + lld + a self-contained UCRT sysroot) instead of built natively on a
  # Windows runner. 3.12 and 3.13 share a single cp312-abi3 wheel (nanobind
  # limited-API module + the stable-ABI python3.lib from the CPython NuGet
  # package); 3.11 is below the abi3 floor and gets a version-specific
  # wheel. See scripts/cross/README.md.
  build_wheels_windows_cross:
    name: Cross-build Windows wheel on Ubuntu (${{ matrix.artifact }}, llvm-mingw)
    env:
      # Cache C++ compilation across runs (host protoc, target abseil/protobuf,
      # onnx/onnxsim), matching the native build_wheels job.
      SCCACHE_GHA_ENABLED: 'on'
      ACTIONS_CACHE_SERVICE_V2: 'on'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { py_ver: '3.11', abi3: '0', artifact: cp311 }   # version-specific (below abi3 floor)
          - { py_ver: '3.12', abi3: '1', artifact: abi3 }    # abi3: also serves 3.13+
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: Update version
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "ONNXSIM_RELEASE=${{ github.ref_name }}" >> ${GITHUB_ENV}
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build xz-utils unzip build-essential
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.py_ver }}
      - name: Install Python build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install nanobind==2.12.0 wheel setuptools
      - name: Cross-build wheel (llvm-mingw)
        env:
          BACKEND: llvm-mingw
          PYVER: ${{ matrix.py_ver }}
          ABI3: ${{ matrix.abi3 }}
        run: bash scripts/cross/build_windows_wheel.sh
      - name: Check ABI3
        if: ${{ matrix.abi3 == '1' }}
        run: |
          python -m pip install abi3audit
          abi3audit --strict -v --report ./wheelhouse/*.whl
      - uses: actions/upload-artifact@v7
        with:
          # python-dist-* so the upload_pypi job's download pattern picks it up.
          name: python-dist-windows-cross-${{ matrix.artifact }}
          path: ./wheelhouse/*.whl

  test_wheels_windows_cross:
    name: Test cross-built wheel on Windows (py ${{ matrix.py_ver }})
    needs: build_wheels_windows_cross
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        # A pull request only needs a smoke test that the cross-built wheels
        # still install and run, so it's cut down to just the oldest (cp311)
        # artifact there; push/release still test all three (the 3.13 entry
        # re-tests the exact cp312-abi3 wheel the 3.12 job already covers, but
        # that's fine outside PRs where CI job count matters less).
        include: ${{ github.event_name == 'pull_request' && fromJSON('[{"py_ver":"3.11","artifact":"cp311"}]') || fromJSON('[{"py_ver":"3.11","artifact":"cp311"},{"py_ver":"3.12","artifact":"abi3"},{"py_ver":"3.13","artifact":"abi3"}]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.py_ver }}
      # uv installs (and links) much faster than pip; its global cache (keyed on
      # the requirements + this workflow) caches the packages, torch included.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          # Per-Python cache: setup-uv's key omits the interpreter version, so
          # without a suffix all matrix jobs would share one blob.
          cache-suffix: py${{ matrix.py_ver }}
          cache-dependency-glob: |
            scripts/cross/windows-test-requirements.txt
            .github/workflows/build-and-test.yml
      - uses: actions/download-artifact@v8
        with:
          name: python-dist-windows-cross-${{ matrix.artifact }}
          path: wheelhouse
      - name: Install cross-built wheel + test deps
        shell: bash
        run: |
          uv pip install --system torch==2.10.0 torchvision==0.25.0 --index-url https://download.pytorch.org/whl/cpu/
          uv pip install --system -r scripts/cross/windows-test-requirements.txt
          # Install the cross-built wheel by path (forces our wheel, not PyPI's).
          whl=$(ls wheelhouse/onnxsim-*.whl)
          echo "installing ${whl}"
          uv pip install --system "${whl}"
      # Run from a neutral directory: the repo root's ./onnxsim source package
      # (without the compiled .pyd) would otherwise shadow the installed wheel.
      - name: Verify the wheel is really the cross-built one
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          python -c "import onnxsim, onnxsim.onnxsim_cpp2py_export as m; print('onnxsim', onnxsim.__version__); print(m.__file__)"
      - name: Run tests
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          # test_ext allocates a ~2 GiB fp16 tensor; skip it on the Windows runner.
          pytest -v -k "not test_ext" "${GITHUB_WORKSPACE}/tests"
          onnxsim -h
          onnxsim --list-default-optimizers

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    env:
      CMAKE_GENERATOR: Ninja
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
      CMAKE_LINKER_TYPE: LLD
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
        fetch-depth: 0
    - uses: mozilla-actions/sccache-action@v0.0.11

    - name: Update version
      if: startsWith(github.ref, 'refs/tags/v')
      run: echo "ONNXSIM_RELEASE=${{ github.ref_name }}" >> ${GITHUB_ENV}

    - name: Build sdist
      run: |
        pushd scripts/onnx-simplifier
        pipx run build --sdist
        mv dist ../..
        popd
        pipx run build --sdist

    - name: Install and test sdist
      run: |
        # It's important to leave the project directory where a 'onnxsim' subdirectory exists
        cd dist
        python3 -m pip install onnxruntime ninja sccache
        python3 -m pip install onnxsim-*.tar.gz
        python3 -c "import onnxsim; print(dir(onnxsim))"
        python3 -m pip uninstall -y onnxsim
        python3 -m pip install onnx_simplifier-*.tar.gz
        python3 -c "import onnxsim; print(dir(onnxsim))"
        python3 -m pip uninstall -y onnx-simplifier

        # Disable publish of alias package
        rm onnx_simplifier-*.tar.gz

    - uses: actions/upload-artifact@v7
      with:
        name: python-dist-sdist
        path: dist/*.tar.gz

  # Builds a real, installable Pyodide/wasm32 wheel via `pyodide build`
  # (pyodide-build's pywasmcross-wrapped toolchain) plus
  # ONNXSIM_WASM_SIDE_MODULE_RELINK=1 (setup.py; see its own comment on that
  # flag for why `pyodide build` alone doesn't produce a real side module),
  # so onnxsim's release flow ships one alongside every other platform's
  # wheel. See docs/wasm_pyodide.md's "Distributable wheel" section for the
  # full story and what's still new/first-time-in-CI about this.
  #
  # Release-flow-only (push/release/workflow_dispatch), not a plain
  # pull_request: the underlying wasm32 build is already functionally
  # validated per-PR by the separate, path-filtered pyodide-wasm.yml (build +
  # real Pyodide/Node import test). This job's only real job is producing the
  # actual DISTRIBUTABLE ARTIFACT that matters for a release -- duplicating a
  # ~10min wasm cross-compile on every one of this repo's PRs (unlike
  # pyodide-wasm.yml, THIS workflow's own pull_request trigger has no path
  # filter at all) isn't worth paying for something with no release
  # consequence until a tag exists. A push to master already exercises this
  # for real, safely: upload_pypi below publishes push builds to Test PyPI,
  # not the real index, so this gets a genuine dry run on every master push
  # before it can ever gate an actual release.
  #
  # continue-on-error: true -- this is new, first-time-in-CI automation (the
  # only prior validation was one hand-assembled wheel, at a now-outdated ABI
  # epoch -- see docs/wasm_pyodide.md). A failure here should not hold back
  # the native wheels every existing user actually depends on; upload_pypi
  # below only downloads whatever artifacts exist, so a failed/skipped run of
  # this job just means that release ships without the wasm32 wheel, not
  # that it ships nothing.
  #
  # Same toolchain pins as pyodide-wasm.yml (Emscripten 4.0.9 / Pyodide
  # 0.29.4) and why: PyPI's only `onnx` wasm wheel is tagged for ABI epoch
  # 2025_0, which is what this pin matches -- see docs/wasm_pyodide.md.
  build_wheel_pyodide:
    name: Build wheel (wasm32, Pyodide)
    if: ${{ github.event_name != 'pull_request' }}
    continue-on-error: true
    runs-on: ubuntu-latest
    env:
      CMAKE_GENERATOR: Ninja
      EMSCRIPTEN_VERSION: "4.0.9"
      PYODIDE_VERSION: "0.29.4"
      ONNXSIM_WASM_SIDE_MODULE_RELINK: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Update version
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "ONNXSIM_RELEASE=${{ github.ref_name }}" >> ${GITHUB_ENV}
      # The TARGET Python minor version (3.13, matching PYODIDE_VERSION's
      # CPython), same as pyodide-wasm.yml -- `pyodide build` runs setup.py
      # under this HOST interpreter while its cross-build environment steers
      # compilation at the wasm32 target.
      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install cmake ninja nanobind pyodide-build setuptools build

      # --- Host protoc, same requirement/approach as pyodide-wasm.yml ------
      - name: Install protoc 31.1 (matches onnxsim's vendored protobuf)
        run: |
          PROTOC_VERSION=31.1
          curl -sSL -o /tmp/protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          sudo unzip -o /tmp/protoc.zip -d /usr/local bin/protoc 'include/*'
          sudo chmod +x /usr/local/bin/protoc
          protoc --version

      - name: Prepare ccache timestamp
        id: ccache_cache_timestamp
        run: echo "timestamp=$(date -Iseconds)" >> "${GITHUB_OUTPUT}"
      - name: ccache cache files
        uses: actions/cache@v6
        with:
          path: .ccache
          key: pyodide-wheel-ccache-${{ steps.ccache_cache_timestamp.outputs.timestamp }}
          restore-keys: |
              pyodide-wheel-ccache-
      - run: |
          sudo apt install -y ccache
          echo "CCACHE_DIR=${PWD}/.ccache" >> "${GITHUB_ENV}"
          echo "CCACHE_MAXSIZE=500M" >> "${GITHUB_ENV}"
          echo "_EMCC_CCACHE=1" >> "${GITHUB_ENV}"

      # emsdk activated on PATH before `pyodide build` runs (rather than
      # relying solely on pyodide-build's own internal toolchain management)
      # for two reasons: (1) pins the EXACT Emscripten version validated to
      # compile onnxsim's vendored protobuf cleanly (see pyodide-wasm.yml's
      # header comment), and (2) setup.py's ONNXSIM_WASM_SIDE_MODULE_RELINK
      # relink step shells out to `em++`/`llvm-nm` directly (`shutil.which`),
      # which needs a real, unwrapped Emscripten toolchain on PATH -- `pyodide
      # build` prepends its own pywasmcross wrapper directory in front of
      # whatever's already on PATH for the subprocess it spawns, so this
      # doesn't fight that wrapping, it just makes sure the real compiler is
      # still reachable behind it.
      - name: Install emsdk ${{ env.EMSCRIPTEN_VERSION }}
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git
          ./emsdk/emsdk install "${EMSCRIPTEN_VERSION}"
          ./emsdk/emsdk activate "${EMSCRIPTEN_VERSION}"

      - name: Install Pyodide xbuildenv ${{ env.PYODIDE_VERSION }}
        run: |
          . ./emsdk/emsdk_env.sh
          pyodide xbuildenv install "${PYODIDE_VERSION}"

      - name: Build the Pyodide wheel
        run: |
          . ./emsdk/emsdk_env.sh
          pyodide build
          mkdir -p wheelhouse
          # Not assuming a specific --outdir flag/default across
          # pyodide-build versions (this repo's other pyodide jobs install it
          # unpinned) -- find whatever it produced instead.
          find . -maxdepth 3 -name 'onnxsim-*wasm32.whl' -not -path './wheelhouse/*' -exec cp -v {} wheelhouse/ \;
          ls -la wheelhouse

      - name: ccache statistics
        if: always()
        run: ccache -s

      - name: Sanity-check the wheel was actually produced and tagged for wasm32
        run: |
          whl=$(ls wheelhouse/onnxsim-*.whl 2>/dev/null | head -1)
          if [ -z "$whl" ]; then
            echo "::error::no wheelhouse/onnxsim-*.whl produced by 'pyodide build'"
            exit 1
          fi
          echo "built: ${whl}"
          case "$(basename "$whl")" in
            *wasm32.whl) ;;
            *) echo "::error::${whl} is not tagged for wasm32"; exit 1 ;;
          esac

      # --- Integration test: install the real wheel in a real Pyodide/Node
      # runtime, not just the loose .so pyodide-wasm.yml already covers -----
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install the pyodide npm package (pinned to ${{ env.PYODIDE_VERSION }})
        run: |
          mkdir -p /tmp/pyodide-wheel-smoke-test-env
          cd /tmp/pyodide-wheel-smoke-test-env
          npm install --no-save "pyodide@${PYODIDE_VERSION}"
          cp "${GITHUB_WORKSPACE}/scripts/pyodide_wheel_smoke_test.mjs" .
      - name: Verify the built wheel installs via micropip and runs
        run: |
          cd /tmp/pyodide-wheel-smoke-test-env
          whl=$(ls "${GITHUB_WORKSPACE}"/wheelhouse/onnxsim-*.whl)
          node ./pyodide_wheel_smoke_test.mjs "${whl}"

      - uses: actions/upload-artifact@v7
        with:
          # python-dist-* so upload_pypi's wildcard download pattern below
          # picks this up automatically, same as every other wheel job.
          name: python-dist-pyodide
          path: wheelhouse/onnxsim-*.whl

  upload_pypi:
    if: (github.repository == 'onnxsim/onnxsim') && (github.event_name == 'push' || github.event_name == 'release')
    name: Upload to PyPI
    needs: [build_wheels, test_formal_verification, build_wheels_windows_cross, test_wheels_windows_cross, build_sdist, build_wheel_pyodide]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/onnxsim
    permissions:
      id-token: write
    steps:
    - uses: actions/download-artifact@v8
      with:
        # unpacks python-dist artifact into dist/
        # if `name: python-dist` is omitted, the action will create extra parent dir
        pattern: python-dist-*
        path: dist
        merge-multiple: true
    - name: Publish distribution 📦 to Test PyPI
      if: ${{ github.ref == 'refs/heads/master' }}
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        repository_url: https://test.pypi.org/legacy/
        verbose: true
    - name: Publish distribution 📦 to PyPI
      if: startsWith(github.ref, 'refs/tags/v')
      uses: pypa/gh-action-pypi-publish@release/v1
