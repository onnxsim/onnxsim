name: TinyEngine Integration

# Checks onnxsim's output against MIT HAN Lab's TinyEngine code generator --
# see scripts/tinyengine/README.md.
#
# TinyEngine has no PyPI package and no ONNX importer at all (it ingests
# quantized TFLite, not ONNX -- see scripts/tinyengine/tinyengine_ops.py's
# docstring), and this repository has no ONNX->TFLite conversion step, so
# unlike scripts/edgeai/real_compile.py there is no real-compiler job here
# to graduate to: this is a static, dependency-light heuristic
# (tests/test_tinyengine_compat.py, scripts/tinyengine/run_tinyengine_compat.py)
# that runs on any stock runner with just onnxsim -- no download, no device.

on:
  schedule:
    - cron: "0 8 * * 1" # Mondays 08:00 UTC (weekly)
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/tinyengine-integration.yml"
      - "scripts/tinyengine/**"
      - "scripts/common/**"
      - "tests/test_tinyengine_compat.py"

concurrency:
  group: tinyengine-integration-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build onnxsim wheel
    runs-on: ubuntu-24.04
    env:
      SCCACHE_GHA_ENABLED: "on"
      ACTIONS_CACHE_SERVICE_V2: "on"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: Build cp312 wheel
        uses: pypa/cibuildwheel@v4.3.4
        env:
          CIBW_BUILD: "cp312-manylinux_x86_64"
          CIBW_ARCHS: native
          CIBW_BUILD_FRONTEND: "pip; args: --no-build-isolation"
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_ENVIRONMENT_PASS_LINUX: CI SCCACHE_GHA_ENABLED ACTIONS_RESULTS_URL ACTIONS_RUNTIME_TOKEN ACTIONS_CACHE_SERVICE_V2
          CIBW_BEFORE_BUILD: "python3 -m pip install --break-system-packages cmake ninja setuptools sccache nanobind"
          CIBW_ENVIRONMENT: CMAKE_ARGS="-DONNX_USE_PROTOBUF_SHARED_LIBS=OFF" CMAKE_GENERATOR=Ninja CMAKE_CXX_COMPILER_LAUNCHER=sccache CMAKE_LINKER_TYPE=LLD
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: "auditwheel repair -w {dest_dir} {wheel} --strip"
      - uses: actions/upload-artifact@v7
        with:
          name: onnxsim-wheel-tinyengine
          path: ./wheelhouse/*.whl

  tinyengine-compat:
    name: TinyEngine compatibility check (static, no SDK/device)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          name: onnxsim-wheel-tinyengine
          path: wheelhouse
      - name: Install onnxsim wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install wheelhouse/*.whl
      # Run from runner.temp, not the checkout: the repo root contains the
      # `onnxsim/` source dir (no compiled extension), which would shadow the
      # installed wheel on `import onnxsim`. Reference the harness by absolute
      # $GITHUB_WORKSPACE path. Same guard the EP/model-regression workflows use.
      - name: Show environment
        working-directory: ${{ runner.temp }}
        run: |
          python -c "import onnxsim; print('onnxsim', onnxsim.__version__)"
      - name: Run static TinyEngine compatibility suite
        working-directory: ${{ runner.temp }}
        run: |
          pytest -v "$GITHUB_WORKSPACE/tests/test_tinyengine_compat.py"
          python "$GITHUB_WORKSPACE/scripts/tinyengine/run_tinyengine_compat.py" \
            --output tinyengine-compat.csv
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tinyengine-compat-report
          path: ${{ runner.temp }}/tinyengine-compat.csv
          if-no-files-found: ignore
