[build-system]
requires = ["setuptools>=77", "wheel", "nanobind>=2.12.0"]
build-backend = "setuptools.build_meta:__legacy__"

[project]
name = "onnxsim"
dynamic = ["version"]
description = "Simplify your ONNX model"
readme = "README.md"
license = "MIT AND (Apache-2.0 OR BSD-2-Clause)"
requires-python = ">=3.11"
dependencies = [
    "onnx",
]
authors = [
    {name = "ONNX Simplifier Authors", email = "daquexian566@gmail.com"},
]
keywords = ["deep-learning", "ONNX"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development",
]

[project.optional-dependencies]
# rich is used only to pretty-print terminal reports (the original-vs-simplified
# table, the memory plan, the graph diff, CLI warnings). Without it those fall
# back to plain-text tables via onnxsim._rich_compat; nothing about the produced
# model changes. The 12.1.0 exclusion matches requirements.txt's long-standing
# pin of that known-bad release.
rich = ["rich != 12.1.0"]
# onnxruntime is preferred for constant folding and correctness checking.
# When it is not installed, onnxsim falls back to onnx's reference evaluator.
# onnxsim.lora.export_lora_adapter additionally needs onnxruntime >= 1.20 for
# its AdapterFormat class -- checked at call time via a hasattr guard, not
# by raising this floor, since every other onnxruntime use in the package
# (including the rest of onnxsim.lora/onnxsim.qat's own step-graph training)
# works on far older onnxruntime.
onnxruntime = ["onnxruntime >= 1.6.0"]
# sympy lets the MACs/FLOPs report keep dynamic dimensions (dim_param, e.g.
# "batch") as symbols and produce a formula instead of assuming them to be 1.
symbolic = ["sympy"]
# onnx-shape-inference (https://github.com/justinchuby/onnx-shape-inference) is
# used by ModelInfo (the MACs/FLOPs/memory report) as a drop-in replacement for
# onnx.shape_inference when installed: it resolves more shapes via symbolic
# data propagation, so fewer nodes fall back to contributing 0. Falls back to
# onnx.shape_inference when it is not installed.
shape-inference = ["onnx-shape-inference"]
# Needed by onnxsim.profile_plot.plot_node_reduction() / --node-reduction-plot,
# which renders the "NodeCount" events in a simplify(..., profile=...) trace.
plot = ["matplotlib"]
# z3-solver backs tests/_formal_verify_common.py's translation-validation tests
# (tests/test_formal_verify_*.py): each targeted optimizer rewrite gets a
# hand-written Z3 proof that its documented algebra is a sound equivalence,
# plus a differential check that the compiled pass, run in isolation, agrees
# with that same algebra on concrete models. Unrelated to onnxsim's own
# ONNX-to-ONNX pipeline; those tests are skipped (not failed) without it.
verify = ["z3-solver"]
# Needed by onnxsim.export_transformers_model(), which calls
# optimum.exporters.onnx.main_export to turn a Hugging Face transformers model
# into ONNX before simplifying it. Heavy and unrelated to onnxsim's own
# ONNX-to-ONNX pipeline, so kept out of the base dependencies.
transformers = ["torch", "transformers", "optimum[exporters]", "optimum-onnx"]
# Needed by onnxsim.export_diffusion_model(), which calls
# optimum.exporters.onnx.main_export to turn a Hugging Face diffusers
# pipeline (Stable Diffusion, SDXL, ...) into ONNX before simplifying it.
# Heavy and unrelated to onnxsim's own ONNX-to-ONNX pipeline, so kept out of
# the base dependencies.
diffusion = ["torch", "diffusers", "optimum[exporters]", "optimum-onnx"]
# Needed by onnxsim.export_detectron_model(), which traces a Detectron2
# (https://github.com/facebookresearch/detectron2) model to ONNX before
# simplifying it. Only pulls in torch: detectron2 itself is not published to
# PyPI, so it must be installed separately from source (see
# onnxsim.export_detectron_model's docstring).
detectron2 = ["torch"]
# Needed by onnxsim.export_sam2_model(), which traces a Meta SAM 2
# (https://github.com/facebookresearch/sam2) image encoder/decoder to ONNX
# before simplifying each. Pulls in torch, samexporter (which implements the
# encoder/decoder split this wraps), and hydra-core (SAM 2's config system).
# The real 'sam2' package itself is not published to PyPI under its official
# name, so it must be installed separately from source (see
# onnxsim.export_sam2_model's docstring) -- do not substitute the unrelated,
# unofficial same-named package that is on PyPI.
sam2 = ["torch", "samexporter", "hydra-core"]
# Needed by onnxsim.torch_training.compile_torch_training_loop(), which
# exports a real torch.nn.Module to ONNX via torch.export's FX graph
# (torch.onnx.export(..., dynamo=True)) and hands the result to
# onnxsim.compile_training_loop -- training itself still runs entirely on
# onnxsim's own graph_grad/qat_graph, never on torch autograd, so this is
# the only onnxsim module that needs torch at all. >= 2.5 is a real floor,
# not a copy of the other torch extras' unpinned ones: that is the release
# the dynamo=True exporter argument landed in (it replaced the older,
# separate torch.onnx.dynamo_export() function). onnxscript is torch.onnx's
# own dynamo exporter's dependency, not onnxsim's -- torch.onnx.export(...,
# dynamo=True) imports it lazily and fails with a bare "No module named
# 'onnxscript'" if it is missing, so it is listed here too rather than left
# for that confusing error to surface.
torch-training = ["torch >= 2.5", "onnxscript"]

[project.urls]
Homepage = "https://github.com/onnxsim/onnxsim"

[project.scripts]
onnxsim = "onnxsim:main"

[tool.pytest.ini_options]
# Always report the 10 slowest tests. tests/conftest.py additionally mirrors
# this list into the GitHub Actions job summary when running in CI, so the
# timings are visible without opening the raw logs.
addopts = "--durations=10"

[tool.ruff]
# The vendored single-header option parser is not our code to reformat.
extend-exclude = ["onnxsim/cxxopts.hpp"]

[tool.ruff.lint]
# pycodestyle errors (E), Pyflakes (F), and isort (I). Import sorting is applied
# by `ruff check --fix`; `ruff format` handles the rest of the layout.
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
# Type-check the Python package (not the tests, which lean on dynamic fixtures).
files = ["onnxsim"]
python_version = "3.11"
# onnx/numpy/onnxruntime/torch expose partial or no type information, the
# compiled `onnxsim_cpp2py_export` extension has no stubs, and upstream stubs
# are incomplete (e.g. onnx OpSchema methods). Treat every third-party import as
# Any so the check covers our own code and stays stable across dependency bumps.
# The Lint workflow deliberately runs mypy without these packages installed.
ignore_missing_imports = true
